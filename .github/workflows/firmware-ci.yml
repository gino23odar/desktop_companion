
name: Firmware CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    name: Compile ESP32 firmware

    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Configure ESP32 board support
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json

      - name: Install ESP32 core
        run: |
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Install firmware dependencies
        run: |
          arduino-cli lib update-index
          arduino-cli lib install "Adafruit GFX Library"
          arduino-cli lib install "Adafruit BusIO"
          arduino-cli lib install "Adafruit ILI9341"
          arduino-cli lib install "XPT2046_Touchscreen"
          arduino-cli lib install "ArduinoJson@7.4.3"

      - name: Print installed dependencies
        run: |
          arduino-cli version
          arduino-cli core list
          arduino-cli lib list

      - name: Compile firmware
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:esp32 \
            --warnings all \
            firmware/buddy
            
  animation-tests:
    name: Test animation engine

    runs-on: ubuntu-latest

    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile native C++ tests
        run: |
          mkdir -p build/tests

          g++ \
            -std=c++11 \
            -Wall \
            -Wextra \
            -Werror \
            -pedantic \
            -Ifirmware/buddy \
            firmware/buddy/AnimationEngine.cpp \
            tests/firmware/test_animation_engine.cpp \
            -o build/tests/animation_tests

      - name: Execute animation tests
        run: |
          ./build/tests/animation_tests
  
  storage-tests:
    name: Test mood storage

    runs-on: ubuntu-latest

    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download ArduinoJson
        run: |
          mkdir -p build/deps

          git clone \
            --depth 1 \
            --branch v7.4.3 \
            https://github.com/bblanchon/ArduinoJson.git \
            build/deps/ArduinoJson

      - name: Compile storage tests
        run: |
          mkdir -p build/tests

          g++ \
            -std=c++17 \
            -Wall \
            -Wextra \
            -Werror \
            -pedantic \
            -Ifirmware/buddy \
            -isystem build/deps/ArduinoJson/src \
            firmware/buddy/Mood.cpp \
            firmware/buddy/MoodStorage.cpp \
            tests/firmware/test_mood_storage.cpp \
            -o build/tests/mood_storage_tests

      - name: Execute storage tests
        run: |
          ./build/tests/mood_storage_tests

