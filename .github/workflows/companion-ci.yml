name: Companion CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  companion-tests:
    name: Test desktop companion (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r companion/requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q companion
      - name: Run companion tests
        run: python -m unittest discover -s tests/companion -v
      - name: Verify serial library and CLI
        run: |
          python -m companion --help
          python -m companion ports
